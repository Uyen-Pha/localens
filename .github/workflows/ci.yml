name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded thesis-demo smoke mode
        required: true
        default: fallback-only
        type: choice
        options:
          - fallback-only
          - live-success
      confirmation:
        description: Type RUN_FALLBACK_THESIS_DEMO or RUN_LIVE_THESIS_DEMO for the selected mode
        required: true
        type: string
      payment_qa_slot:
        description: Exact finite payment/replay slot for live-success
        required: true
        default: qa-01
        type: choice
        options:
          - qa-01
          - qa-02
          - qa-03
          - qa-04
      cancellation_qa_slot:
        description: Exact finite cancellation/replay slot for live-success
        required: true
        default: qa-02
        type: choice
        options:
          - qa-01
          - qa-02
          - qa-03
          - qa-04
      fallback_qa_slot:
        description: Exact finite fallback-only AI demo slot
        required: true
        default: qa-03
        type: choice
        options:
          - qa-03
          - qa-04

permissions:
  contents: read

jobs:
  quality-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run demo quality gate
        run: pnpm check

  demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Google Chrome
        run: pnpm exec playwright install --with-deps chrome

      - name: Run demo browser acceptance
        env:
          LOCALENS_RUNTIME_BROWSER: "chrome"
          PLAYWRIGHT_STATIC: "1"
        run: pnpm test:e2e

  runtime-local:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Google Chrome
        run: pnpm exec playwright install --with-deps chrome

      - name: Create private CI log directory
        shell: bash
        run: mkdir -p ci-logs

      - name: Verify local database, RLS, grants, types, and concurrency
        shell: bash
        run: pnpm db:verify > ci-logs/db-verify.log 2>&1

      - name: Verify runtime authentication
        shell: bash
        env:
          LOCALENS_RUNTIME_BROWSER: "chrome"
        run: pnpm test:e2e:runtime-auth > ci-logs/runtime-auth.log 2>&1

      - name: Verify authenticated AI itinerary runtime
        shell: bash
        env:
          LOCALENS_RUNTIME_BROWSER: "chrome"
        run: pnpm test:e2e:runtime-itinerary > ci-logs/runtime-itinerary.log 2>&1

      - name: Verify runtime fixed-tour booking and payment
        shell: bash
        env:
          LOCALENS_RUNTIME_BROWSER: "chrome"
        run: pnpm test:e2e:runtime-fixed-tour > ci-logs/runtime-fixed-tour.log 2>&1

      - name: Verify runtime guide assignment
        shell: bash
        env:
          LOCALENS_RUNTIME_BROWSER: "chrome"
        run: pnpm test:e2e:runtime-guide-assignment > ci-logs/runtime-guide-assignment.log 2>&1

      - name: Build Supabase runtime
        shell: bash
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3200
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-build-only
        run: pnpm build:supabase > ci-logs/build-supabase.log 2>&1

      - name: Prepare redacted failure artifacts
        id: redact
        if: failure()
        run: node scripts/redact-ci-artifacts.mjs ci-artifacts ci-logs playwright-report test-results

      - name: Upload redacted runtime failure artifacts
        if: ${{ failure() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-local-failure-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  staging-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.LOCALLENS_STAGING_URL != '' }}
    needs:
      - quality-demo
      - demo-e2e
      - runtime-local
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate protected HTTPS target
        shell: bash
        env:
          LOCALLENS_STAGING_URL: ${{ vars.LOCALLENS_STAGING_URL }}
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.LOCALLENS_STAGING_URL);
          if (base.protocol !== "https:" || base.username || base.password) process.exit(1);
          for (const path of ["/en/sign-in/", "/vi/sign-in/"]) {
            const response = await fetch(new URL(path, base), {
              redirect: "manual",
              signal: AbortSignal.timeout(30_000),
            });
            if (response.status < 200 || response.status >= 300) process.exit(1);
          }
          NODE

  thesis-demo-cloud-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - quality-demo
      - demo-e2e
      - runtime-local
    environment: thesis-demo-cloud-smoke
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: localens-thesis-demo-kill-switch
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require an explicitly protected release ref
        shell: bash
        env:
          LOCALLENS_THESIS_DEMO_RELEASE_REFS: ${{ vars.LOCALLENS_THESIS_DEMO_RELEASE_REFS }}
          LOCALLENS_CANDIDATE_REF: ${{ github.ref }}
          LOCALLENS_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const allowed = (process.env.LOCALLENS_THESIS_DEMO_RELEASE_REFS ?? "")
            .split(/[\r\n,]+/u)
            .map((value) => value.trim())
            .filter(Boolean);
          const candidates = new Set([
            process.env.LOCALLENS_CANDIDATE_REF,
            process.env.LOCALLENS_CANDIDATE_SHA,
          ]);
          if (allowed.length === 0 || !allowed.some((value) => candidates.has(value))) process.exit(1);
          NODE

      - name: Run bounded protected thesis-demo smoke
        shell: bash
        env:
          LOCALLENS_THESIS_DEMO_SMOKE_MODE: ${{ inputs.mode }}
          LOCALLENS_THESIS_DEMO_CONFIRMATION: ${{ inputs.confirmation }}
          LOCALLENS_THESIS_DEMO_PAYMENT_QA_SLOT: ${{ inputs.payment_qa_slot }}
          LOCALLENS_THESIS_DEMO_CANCELLATION_QA_SLOT: ${{ inputs.cancellation_qa_slot }}
          LOCALLENS_THESIS_DEMO_FALLBACK_QA_SLOT: ${{ inputs.fallback_qa_slot }}
          LOCALLENS_THESIS_DEMO_EXPECTED_PROJECT_NAME: localens-thesis-demo
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.LOCALLENS_THESIS_DEMO_URL }}
          LOCALLENS_THESIS_DEMO_PROJECT_REF: ${{ vars.LOCALLENS_THESIS_DEMO_PROJECT_REF }}
          LOCALLENS_THESIS_DEMO_ORGANIZATION_ID: ${{ vars.LOCALLENS_THESIS_DEMO_ORGANIZATION_ID }}
          LOCALLENS_THESIS_DEMO_ALLOWED_ORIGIN: ${{ vars.LOCALLENS_THESIS_DEMO_ALLOWED_ORIGIN }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LOCALLENS_DEMO_CUSTOMER_PASSWORD: ${{ secrets.LOCALLENS_DEMO_CUSTOMER_PASSWORD }}
          LOCALLENS_DEMO_QA_CUSTOMER_PASSWORD: ${{ secrets.LOCALLENS_DEMO_QA_CUSTOMER_PASSWORD }}
          LOCALLENS_DEMO_GUIDE_PASSWORD: ${{ secrets.LOCALLENS_DEMO_GUIDE_PASSWORD }}
          LOCALLENS_DEMO_ADMIN_PASSWORD: ${{ secrets.LOCALLENS_DEMO_ADMIN_PASSWORD }}
        run: pnpm smoke:thesis-demo

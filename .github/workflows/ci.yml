name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run demo quality gate
        run: pnpm check

  demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run demo browser acceptance
        env:
          PLAYWRIGHT_STATIC: "1"
        run: pnpm test:e2e

  runtime-local:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Create private CI log directory
        shell: bash
        run: mkdir -p ci-logs

      - name: Verify local database, RLS, grants, types, and concurrency
        shell: bash
        run: pnpm db:verify > ci-logs/db-verify.log 2>&1

      - name: Verify runtime authentication
        shell: bash
        run: pnpm test:e2e:runtime-auth > ci-logs/runtime-auth.log 2>&1

      - name: Verify runtime fixed-tour booking and payment
        shell: bash
        run: pnpm test:e2e:runtime-fixed-tour > ci-logs/runtime-fixed-tour.log 2>&1

      - name: Verify runtime guide assignment
        shell: bash
        run: pnpm test:e2e:runtime-guide-assignment > ci-logs/runtime-guide-assignment.log 2>&1

      - name: Build Supabase runtime
        shell: bash
        run: pnpm build:supabase > ci-logs/build-supabase.log 2>&1

      - name: Prepare redacted failure artifacts
        id: redact
        if: failure()
        run: node scripts/redact-ci-artifacts.mjs ci-artifacts ci-logs playwright-report test-results

      - name: Upload redacted runtime failure artifacts
        if: ${{ failure() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-local-failure-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  staging-smoke:
    needs:
      - quality-demo
      - demo-e2e
      - runtime-local
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOCALLENS_STAGING_URL: ${{ vars.LOCALLENS_STAGING_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate protected HTTPS target
        shell: bash
        run: |
          node -e 'const u = new URL(process.env.LOCALLENS_STAGING_URL); if (u.protocol !== "https:") process.exit(1)'
          curl --fail --silent --show-error --location --max-time 30 "$LOCALLENS_STAGING_URL/en/sign-in/" > /dev/null
          curl --fail --silent --show-error --location --max-time 30 "$LOCALLENS_STAGING_URL/vi/sign-in/" > /dev/null
